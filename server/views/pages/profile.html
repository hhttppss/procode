<!-- Свой профиль. Ставку преподаватель не видит: сервер её в ответе не присылает -->
<section class="grid gap-5 lg:grid-cols-3">
  <div class="space-y-5 lg:col-span-2">
    <div class="panel">
      <div class="panel-head"><h2 class="panel-title">Личные данные</h2></div>
      <form id="profileForm" class="panel-body space-y-4" novalidate>
        <div id="profileFields" class="grid gap-4 sm:grid-cols-2"></div>
        <div class="flex items-center gap-3">
          <button type="submit" id="profileSave" class="btn btn-primary btn-sm" data-label-idle="Сохранить" data-label-loading="Сохраняем…">Сохранить</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <div class="panel-head"><h2 class="panel-title">Смена пароля</h2></div>
      <form id="passwordForm" class="panel-body space-y-4" novalidate>
        <div id="passwordFields" class="grid gap-4 sm:grid-cols-2"></div>
        <button type="submit" id="passwordSave" class="btn btn-outline btn-sm" data-label-idle="Изменить пароль" data-label-loading="Меняем…">Изменить пароль</button>
      </form>
    </div>
  </div>

  <div class="space-y-5">
    <div class="panel">
      <div class="panel-head"><h2 class="panel-title">Учётная запись</h2></div>
      <dl id="accountInfo" class="panel-body space-y-3"></dl>
    </div>

    <div id="statsPanel" class="panel" hidden>
      <div class="panel-head"><h2 class="panel-title">Моя статистика</h2></div>
      <dl id="statsInfo" class="panel-body space-y-3"></dl>
    </div>
  </div>
</section>
