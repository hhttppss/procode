<!-- Ученики. Администратор видит всех и правит карточки, преподаватель — только своих, на просмотр -->
<section class="space-y-5">
  <div id="statusTiles" class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5"></div>

  <form id="filters" class="panel p-4 sm:p-5" role="search">
    <div class="grid gap-3 lg:grid-cols-12">
      <div class="lg:col-span-3">
        <label class="field" for="filterSearch">
          <span class="field-label">Поиск</span>
          <input id="filterSearch" name="q" type="search" class="field-input" placeholder="Имя ученика или группа" autocomplete="off" />
        </label>
      </div>
      <div class="lg:col-span-3">
        <label class="field" for="filterCourse">
          <span class="field-label">Направление</span>
          <select id="filterCourse" name="course" class="field-input"></select>
        </label>
      </div>
      <div class="lg:col-span-2" data-admin-only hidden>
        <label class="field" for="filterTeacher">
          <span class="field-label">Преподаватель</span>
          <select id="filterTeacher" name="teacherId" class="field-input"></select>
        </label>
      </div>
      <div class="lg:col-span-2">
        <label class="field" for="filterStatus">
          <span class="field-label">Статус</span>
          <select id="filterStatus" name="status" class="field-input"></select>
        </label>
      </div>
      <div class="lg:col-span-2">
        <span class="field-label">Возраст</span>
        <div class="flex items-center gap-2">
          <input id="filterAgeFrom" name="ageFrom" type="number" min="3" max="25" class="field-input px-3" placeholder="от" />
          <input id="filterAgeTo" name="ageTo" type="number" min="3" max="25" class="field-input px-3" placeholder="до" />
        </div>
      </div>
    </div>

    <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
      <p id="resultSummary" class="text-sm text-muted" aria-live="polite"></p>
      <div class="flex flex-wrap gap-2">
        <button type="button" id="resetFilters" class="btn btn-outline btn-sm">Сбросить фильтры</button>
        <button type="button" id="addStudent" class="btn btn-primary btn-sm" data-admin-only hidden>Новый ученик</button>
      </div>
    </div>
  </form>

  <div id="listPanel" class="panel">
    <div class="table-scroll hidden lg:block">
      <table class="data-table">
        <caption class="sr-only">Список учеников</caption>
        <thead>
          <tr>
            <th scope="col">Имя</th>
            <th scope="col">Возраст</th>
            <th scope="col">Направление</th>
            <th scope="col">Группа</th>
            <th scope="col">Преподаватель</th>
            <th scope="col">Статус</th>
            <th scope="col" class="text-right">Действие</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="cards" class="space-y-3 p-4 lg:hidden"></div>
  </div>

  <div id="stateBox"></div>

  <div id="coursePanel" class="panel" hidden>
    <div class="panel-head"><h2 class="panel-title">Ученики по направлениям</h2></div>
    <div id="courseList" class="panel-body grid gap-2 sm:grid-cols-2 lg:grid-cols-3"></div>
  </div>
</section>
