<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Заявки — ПроКод</title>

    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body class="min-h-screen bg-mist">
    <header class="sticky top-0 z-30 border-b border-ink/10 bg-paper/90 backdrop-blur">
      <div class="shell flex h-16 items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <a href="/" class="flex items-center gap-2.5 text-ink transition hover:opacity-70" title="На сайт">
            <svg viewBox="0 0 40 40" width="30" height="30" class="text-ink" role="img" aria-label="ПроКод">
              <rect width="40" height="40" rx="11" fill="currentColor" />
              <path
                d="M12 14.5 17.5 20 12 25.5"
                fill="none"
                stroke="#7B93FF"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <rect x="20.5" y="23" width="8.5" height="3" rx="1.5" fill="#FF9E64" />
            </svg>
            <span class="hidden font-display text-base font-semibold tracking-tight sm:inline">ПроКод</span>
          </a>
          <span class="hidden h-6 w-px bg-ink/10 sm:block" aria-hidden="true"></span>
          <h1 class="font-display text-lg font-semibold tracking-tight">Заявки</h1>
        </div>

        <div class="flex items-center gap-2">
          <span
            class="mr-1 hidden items-center gap-1.5 rounded-full bg-ink/[0.05] px-3 py-1.5 text-xs font-medium text-muted sm:flex"
            title="Учётная запись, под которой вы вошли"
          >
            <svg viewBox="0 0 20 20" class="h-3.5 w-3.5 shrink-0 text-cobalt" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="10" cy="6.5" r="3" />
              <path d="M3.8 17a6.2 6.2 0 0 1 12.4 0" stroke-linecap="round" />
            </svg>
            <span class="sr-only">Вы вошли как</span>
            <span data-current-user><!--{{USER}}--></span>
          </span>
          <a
            id="exportCsv"
            class="btn btn-outline btn-sm"
            href="/admin/api/export.csv"
            download
            title="Выгрузить текущую выборку в CSV"
          >
            <span class="hidden sm:inline">Выгрузить&nbsp;</span>CSV
          </a>
          <button type="button" id="logoutButton" class="btn btn-outline btn-sm">Выйти</button>
        </div>
      </div>
    </header>

    <main class="shell py-6 sm:py-8">
      <!-- Плитки-счётчики: клик фильтрует список по статусу -->
      <section aria-label="Заявки по статусам">
        <div id="statusTiles" class="grid grid-cols-2 gap-3 sm:grid-cols-4 lg:grid-cols-7"></div>
      </section>

      <form id="filtersForm" class="card mt-5 p-4 sm:p-5" role="search">
        <div class="grid gap-3 lg:grid-cols-12">
          <div class="lg:col-span-4">
            <label class="field" for="filterSearch">
              <span class="field-label">Поиск</span>
              <input
                id="filterSearch"
                name="q"
                type="search"
                class="field-input"
                placeholder="Имя, телефон, направление…"
                autocomplete="off"
              />
            </label>
          </div>

          <div class="lg:col-span-2">
            <label class="field" for="filterStatus">
              <span class="field-label">Статус</span>
              <select id="filterStatus" name="status" class="field-input"></select>
            </label>
          </div>

          <div class="lg:col-span-2">
            <label class="field" for="filterFrom">
              <span class="field-label">С</span>
              <input id="filterFrom" name="from" type="date" class="field-input" />
            </label>
          </div>

          <div class="lg:col-span-2">
            <label class="field" for="filterTo">
              <span class="field-label">По</span>
              <input id="filterTo" name="to" type="date" class="field-input" />
            </label>
          </div>

          <div class="lg:col-span-2">
            <label class="field" for="filterSort">
              <span class="field-label">Сортировка</span>
              <select id="filterSort" name="sort" class="field-input">
                <option value="new">Сначала новые</option>
                <option value="old">Сначала старые</option>
              </select>
            </label>
          </div>
        </div>

        <div class="mt-4 flex items-center justify-between gap-3">
          <p id="resultSummary" class="text-sm text-muted" aria-live="polite"></p>
          <button type="button" id="resetFilters" class="btn btn-outline btn-sm">Сбросить</button>
        </div>
      </form>

      <!-- Десктоп: таблица -->
      <div id="tableWrapper" class="mt-5 hidden overflow-hidden rounded-3xl border border-ink/[0.07] bg-white shadow-card lg:block">
        <table class="w-full border-collapse text-left text-sm">
          <caption class="sr-only">
            Список заявок с сайта
          </caption>
          <thead class="border-b border-ink/10 bg-mist/60">
            <tr class="text-2xs uppercase tracking-wider text-muted">
              <th scope="col" class="px-5 py-3 font-semibold">Дата и время</th>
              <th scope="col" class="px-5 py-3 font-semibold">Родитель</th>
              <th scope="col" class="px-5 py-3 font-semibold">Телефон</th>
              <th scope="col" class="px-5 py-3 font-semibold">Ребёнок</th>
              <th scope="col" class="px-5 py-3 font-semibold">Направление</th>
              <th scope="col" class="px-5 py-3 font-semibold">Статус</th>
              <th scope="col" class="px-5 py-3 text-right font-semibold">Действие</th>
            </tr>
          </thead>
          <tbody id="applicationsBody" class="divide-y divide-ink/[0.07]"></tbody>
        </table>
      </div>

      <!-- Мобильный: карточки -->
      <div id="applicationsCards" class="mt-5 space-y-3 lg:hidden"></div>

      <div id="emptyState" class="card mt-5 py-14 text-center" hidden>
        <p class="font-display text-lg" data-empty-title></p>
        <p class="mx-auto mt-2 max-w-sm text-sm text-muted" data-empty-text></p>
      </div>

      <div id="loadingState" class="card mt-5 py-14 text-center text-sm text-muted" hidden>Загружаем заявки…</div>
    </main>

    <!-- Боковая панель заявки -->
    <div id="drawer" class="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
      <div
        id="drawerBackdrop"
        class="absolute inset-0 bg-ink/50 opacity-0 backdrop-blur-sm transition-opacity duration-200"
      ></div>

      <div
        id="drawerPanel"
        class="absolute inset-y-0 right-0 flex w-full max-w-md translate-x-full flex-col bg-paper shadow-lift transition-transform duration-300 ease-out"
      >
        <header class="flex items-start justify-between gap-4 border-b border-ink/10 px-5 py-4 sm:px-6">
          <div class="min-w-0">
            <p class="eyebrow">Заявка</p>
            <h2 id="drawerTitle" class="mt-2 truncate font-display text-xl" data-field="parentName"></h2>
            <p class="mt-1 text-sm text-muted">
              <span data-field="createdAt"></span>
            </p>
          </div>
          <button
            type="button"
            id="drawerClose"
            class="-mr-1 rounded-full border border-ink/10 p-2 text-muted transition hover:bg-ink/5 hover:text-ink"
            aria-label="Закрыть панель заявки"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>

        <div class="flex-1 space-y-5 overflow-y-auto px-5 py-5 sm:px-6">
          <dl class="grid grid-cols-1 gap-x-4 gap-y-3 text-sm sm:grid-cols-2">
            <div>
              <dt class="text-2xs uppercase tracking-wider text-muted">Телефон</dt>
              <dd class="mt-1">
                <a
                  data-field="phoneLink"
                  class="font-mono tnum text-cobalt underline-offset-4 hover:underline"
                  href="#"
                ></a>
              </dd>
            </div>
            <div>
              <dt class="text-2xs uppercase tracking-wider text-muted">Ребёнок</dt>
              <dd class="mt-1 font-medium" data-field="child"></dd>
            </div>
            <div class="sm:col-span-2">
              <dt class="text-2xs uppercase tracking-wider text-muted">Направление</dt>
              <dd class="mt-1 font-medium" data-field="course"></dd>
            </div>
          </dl>

          <div>
            <p class="text-2xs uppercase tracking-wider text-muted">Комментарий родителя</p>
            <p class="mt-1 whitespace-pre-line rounded-xl bg-mist/70 px-4 py-3 text-sm" data-field="comment"></p>
          </div>

          <label class="field" for="drawerStatus">
            <span class="field-label">Статус</span>
            <select id="drawerStatus" class="field-input"></select>
          </label>

          <label class="field" for="drawerManagerComment">
            <span class="field-label">Комментарий менеджера</span>
            <textarea
              id="drawerManagerComment"
              class="field-input min-h-[7rem] resize-y"
              rows="4"
              maxlength="2000"
              placeholder="Что обсудили, когда перезвонить…"
            ></textarea>
          </label>

          <dl class="grid grid-cols-2 gap-3 border-t border-ink/10 pt-4 text-2xs text-muted">
            <div>
              <dt class="uppercase tracking-wider">Создана</dt>
              <dd class="mt-1 font-mono tnum" data-field="createdAtFull"></dd>
            </div>
            <div>
              <dt class="uppercase tracking-wider">Изменена</dt>
              <dd class="mt-1 font-mono tnum" data-field="updatedAtFull"></dd>
            </div>
          </dl>
        </div>

        <footer class="flex flex-wrap items-center gap-2 border-t border-ink/10 bg-white px-5 py-4 sm:px-6">
          <button type="button" id="drawerSave" class="btn btn-primary btn-sm flex-1" data-label-idle="Сохранить" data-label-loading="Сохраняем…">
            Сохранить
          </button>
          <a id="drawerCall" class="btn btn-outline btn-sm" href="#">Позвонить</a>
          <button
            type="button"
            id="drawerDelete"
            class="btn btn-sm border border-red-200 text-red-600 transition hover:bg-red-50"
          >
            Удалить
          </button>
        </footer>
      </div>
    </div>

    <div id="toasts" class="pointer-events-none fixed bottom-5 right-5 z-[60] flex w-72 flex-col gap-2" role="status" aria-live="polite"></div>

    <!--{{STATUSES}}-->
    <script src="/js/admin.js" defer></script>
  </body>
</html>
