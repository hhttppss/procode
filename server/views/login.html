<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Вход для сотрудников — ПроКод</title>

    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <!-- Шрифты — свои, из public/fonts; @font-face объявлены в styles.css.
         Страница входа — один экран целиком: заголовок Unbounded, форма Onest. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/unbounded-cyrillic.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/onest-cyrillic.woff2" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body class="bg-ink">
    <div class="on-ink relative min-h-screen overflow-hidden bg-ink bg-halo">
      <div class="absolute inset-0 bg-grid opacity-50" aria-hidden="true"></div>

      <main class="shell relative flex min-h-screen items-center justify-center py-14">
        <div class="w-full max-w-sm">
          <a
            href="/"
            class="mx-auto mb-8 flex w-fit items-center gap-3 rounded-full px-2 py-1 text-white transition hover:opacity-80"
          >
            <svg viewBox="0 0 40 40" width="36" height="36" class="text-cobalt" role="img" aria-label="ПроКод">
              <rect width="40" height="40" rx="11" fill="currentColor" />
              <path
                d="M12 14.5 17.5 20 12 25.5"
                fill="none"
                stroke="#FFFDF9"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <rect x="20.5" y="23" width="8.5" height="3" rx="1.5" fill="#FF9E64" />
            </svg>
            <span class="font-display text-xl font-semibold tracking-tight">ПроКод</span>
          </a>

          <form id="loginForm" class="card-ink shadow-glow" novalidate>
            <p class="eyebrow">Служебный вход</p>
            <h1 class="mt-3 font-display text-2xl text-white">Платформа школы</h1>
            <p class="mt-2 text-sm text-cobalt-100/70">
              Заявки, ученики, расписание и финансы — в одном месте. Доступ зависит от вашей роли.
            </p>

            <div class="mt-7 space-y-4">
              <label class="field" for="loginField">
                <span class="field-label">Логин</span>
                <input
                  id="loginField"
                  name="login"
                  type="text"
                  class="field-input"
                  autocomplete="username"
                  autocapitalize="none"
                  spellcheck="false"
                  required
                />
              </label>

              <label class="field" for="passwordField">
                <span class="field-label">Пароль</span>
                <input
                  id="passwordField"
                  name="password"
                  type="password"
                  class="field-input"
                  autocomplete="current-password"
                  required
                />
              </label>
            </div>

            <p id="loginError" class="field-error mt-4 text-red-400" role="alert"></p>

            <button
              type="submit"
              id="loginSubmit"
              class="btn btn-primary mt-6 w-full"
              data-label-idle="Войти"
              data-label-loading="Проверяем…"
            >
              Войти
            </button>
          </form>

          <p class="mt-6 text-center text-sm">
            <a href="/" class="text-cobalt-300 underline-offset-4 transition hover:text-white hover:underline">
              Вернуться на сайт
            </a>
          </p>
        </div>
      </main>
    </div>

    <script src="/js/login.js" defer></script>
  </body>
</html>
