<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ПроКод — детская онлайн-школа программирования">
  <defs>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B4BF2" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0F1222" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#7B93FF" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0F1222"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>
  <circle cx="1105" cy="98" r="200" fill="#FF9E64" fill-opacity="0.07"/>

  <g transform="translate(88 74)">
    <rect width="64" height="64" rx="18" fill="#2B4BF2"/>
    <path d="M20 23 l28 9 -28 9" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="168" y="118" font-family="Unbounded, Segoe UI, sans-serif" font-size="32" font-weight="600" fill="#FFFDF9">ПроКод</text>

  <g font-family="Unbounded, Segoe UI, sans-serif" font-size="62" font-weight="600" fill="#FFFDF9">
    <text x="88" y="278">Ребёнок создаст первый</text>
    <text x="88" y="352">проект, который можно</text>
    <text x="88" y="426">показать</text>
  </g>
  <rect x="88" y="438" width="286" height="14" rx="7" fill="#FF9E64" fill-opacity="0.9"/>

  <text x="88" y="516" font-family="Onest, Segoe UI, sans-serif" font-size="26" fill="#A9B8FF">Онлайн-школа программирования для детей 10–17 лет</text>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#FFFDF9" fill-opacity="0.7">
    <text x="88" y="574">10 направлений</text>
    <text x="322" y="574">·</text>
    <text x="356" y="574">группы до 6 человек</text>
    <text x="644" y="574">·</text>
    <text x="678" y="574">первый урок бесплатно</text>
  </g>
</svg>
